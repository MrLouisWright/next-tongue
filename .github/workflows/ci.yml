name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter next-tongue run build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter next-tongue run check:deps
      - run: pnpm --filter next-tongue run check:size
      - run: pnpm --filter next-tongue run bench:matcher
      - run: pnpm --filter next-tongue run bench:check
      - run: pnpm check:docs
      - run: pnpm benchmark
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: locale-matcher-bench
          path: benchmarks/results/locale-matcher.json

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter next-tongue run build
      - run: pnpm build:examples
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
