  #     - uses: actions/checkout@v4
  #     - run: npm ci
  #     - run: npx tongue push
  #       env:
  #         LOOMLOCALE_TOKEN: ${{ secrets.LOOMLOCALE_TOKEN }}
  #
  # Alternative without PRs: stage files for another tool, e.g.
  #   npx tongue update --ci --out-dir .tongue-staging
